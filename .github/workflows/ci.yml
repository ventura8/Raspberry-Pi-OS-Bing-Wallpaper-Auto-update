---
name: CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '*.sh'
      - '*.ps1'
      - 'tests/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'VERSION'
      - 'pyproject.toml'
      - '.editorconfig'
      - '.markdownlint.yaml'
      - '.yamllint.yaml'
      - '.hadolint.yaml'
      - '.pre-commit-config.yaml'
      - '.instructions.md'
      - '.prompt.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.github/**'
      - '.agent/**'
      - '.agents/**'
      - 'docs/**'
      - 'README.md'
      - 'docs/Instructions.md'
      - '.github/workflows/ci.yml'
      - 'sonar-project.properties'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build Test Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: wallpaper-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Mandatory Quality Checks
        run: |
          docker run --rm \
            -v "$PWD:/workdir" \
            -w /workdir \
            wallpaper-test bash scripts/quality_checks.sh

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build Test Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: wallpaper-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Test
        run: |
          mkdir -p coverage
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -e COVERAGE=1 \
            -e COVERAGE_OUTPUT=/app/coverage \
            -v "$PWD/coverage:/app/coverage" \
            wallpaper-test ./tests/run_suite.sh --file tests/install_test.bats

      - name: Uninstall Test
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -e COVERAGE=1 \
            -e COVERAGE_OUTPUT=/app/coverage \
            -v "$PWD/coverage:/app/coverage" \
            wallpaper-test ./tests/run_suite.sh --file tests/uninstall_test.bats

      - name: Upload Installer Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-installer
          path: coverage/
          include-hidden-files: true

  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build Test Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: wallpaper-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute Wallpaper Tests
        run: |
          mkdir -p coverage
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -e COVERAGE=1 \
            -e COVERAGE_OUTPUT=/app/coverage \
            -v "$PWD/coverage:/app/coverage" \
            wallpaper-test ./tests/run_suite.sh --file tests/bing_wallpaper_test.bats

      - name: Upload Component Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-component
          path: coverage/
          include-hidden-files: true

  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build Test Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: wallpaper-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute E2E Tests
        run: |
          mkdir -p coverage
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -e COVERAGE=1 \
            -e COVERAGE_OUTPUT=/app/coverage \
            -v "$PWD/coverage:/app/coverage" \
            wallpaper-test ./tests/run_suite.sh --e2e-only

      - name: Upload System Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-system
          path: coverage/
          include-hidden-files: true

  coverage-report:
    name: Merge and Publish Report
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - component-tests
      - system-tests
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build Test Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: wallpaper-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download Installer Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-installer
          path: coverage_inputs/installer

      - name: Download Component Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-component
          path: coverage_inputs/component

      - name: Download System Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-system
          path: coverage_inputs/system

      - name: Merge Coverage Reports
        run: |
          mkdir -p coverage/merged
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v "$PWD:/workdir" \
            -w /workdir \
            wallpaper-test \
            kcov --merge coverage/merged \
                 coverage_inputs/installer/* \
                 coverage_inputs/component/* \
                 coverage_inputs/system/*

      - name: Process Coverage XML
        run: |
          merged_xml="$(find coverage/merged -name cobertura.xml | head -n 1)"
          if [ -f "$merged_xml" ]; then
            cp "$merged_xml" coverage/cobertura.xml
            python3 tests/transform_coverage.py coverage/cobertura.xml
          else
            echo "Merged cobertura.xml not found"
            exit 1
          fi

      - name: Convert Coverage for SonarQube
        run: python3 scripts/cobertura_to_sonar.py coverage/cobertura.xml coverage/sonar-coverage.xml

      - name: Upload SonarQube Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sonar-coverage
          path: coverage/sonar-coverage.xml

      - name: Enforce Coverage Threshold
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('coverage/cobertura.xml').getroot()
          line_rate = float(root.get('line-rate', '0')) * 100
          print(f'Total coverage: {line_rate:.2f}%')
          if line_rate < 90.0:
              raise SystemExit('Coverage below 90% threshold')
          PY

      - name: Generate Detailed Summary
        if: always()
        run: |
          python3 tests/generate_summary.py coverage/cobertura.xml | tee coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: full-coverage-report
          path: coverage/merged/

      - name: Add Coverage PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          recreate: true
          path: coverage-summary.md

  sonarqube:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest
    needs: coverage-report
    # Secrets are unavailable to pull requests from forks; skip analysis there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download SonarQube Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sonar-coverage
          path: coverage

      - name: Read Project Version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4  # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.version.outputs.value }}
            -Dsonar.qualitygate.wait=true
