---
name: CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '*.sh'
      - '*.ps1'
      - 'tests/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - '.editorconfig'
      - '.markdownlint.yaml'
      - '.yamllint.yaml'
      - '.hadolint.yaml'
      - '.pre-commit-config.yaml'
      - '.instructions.md'
      - '.prompt.md'
      - 'AGENTS.md'
      - '.github/**'
      - '.agent/**'
      - 'docs/**'
      - 'README.md'
      - 'docs/Instructions.md'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build Test Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: wallpaper-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Mandatory Quality Checks
        run: |
          docker run --rm \
            -v "$PWD:/workdir" \
            -w /workdir \
            wallpaper-test bash scripts/quality_checks.sh

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build Test Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: wallpaper-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Test
        run: |
          mkdir -p coverage
          chmod 777 coverage
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -e COVERAGE=1 \
            -e COVERAGE_OUTPUT=/app/coverage \
            -v $PWD/coverage:/app/coverage \
            wallpaper-test ./tests/run_suite.sh --file tests/install_test.bats

      - name: Uninstall Test
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -e COVERAGE=1 \
            -e COVERAGE_OUTPUT=/app/coverage \
            -v $PWD/coverage:/app/coverage \
            wallpaper-test ./tests/run_suite.sh --file tests/uninstall_test.bats

      - name: Upload Installer Coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-installer
          path: coverage/
          include-hidden-files: true

  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build Test Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: wallpaper-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute Wallpaper Tests
        run: |
          mkdir -p coverage
          chmod 777 coverage
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -e COVERAGE=1 \
            -e COVERAGE_OUTPUT=/app/coverage \
            -v $PWD/coverage:/app/coverage \
            wallpaper-test ./tests/run_suite.sh --file tests/bing_wallpaper_test.bats

      - name: Upload Component Coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-component
          path: coverage/
          include-hidden-files: true

  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build Test Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: wallpaper-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute E2E Tests
        run: |
          mkdir -p coverage
          chmod 777 coverage
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -e COVERAGE=1 \
            -e COVERAGE_OUTPUT=/app/coverage \
            -v $PWD/coverage:/app/coverage \
            wallpaper-test ./tests/run_suite.sh --e2e-only

      - name: Upload System Coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-system
          path: coverage/
          include-hidden-files: true

  coverage-report:
    name: Merge and Publish Report
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - component-tests
      - system-tests
    permissions:
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build Test Image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: wallpaper-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download Installer Coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-installer
          path: coverage_inputs/installer

      - name: Download Component Coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-component
          path: coverage_inputs/component

      - name: Download System Coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-system
          path: coverage_inputs/system

      - name: Merge Coverage Reports
        run: |
          mkdir -p coverage/merged
          chmod 777 coverage/merged
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            --user root \
            -v $PWD:/workdir \
            -w /workdir \
            wallpaper-test \
            kcov --merge coverage/merged \
                 coverage_inputs/installer/* \
                 coverage_inputs/component/* \
                 coverage_inputs/system/*

      - name: Process Coverage XML
        run: |
          merged_xml="$(find coverage/merged -name cobertura.xml | head -n 1)"
          if [ -f "$merged_xml" ]; then
            cp "$merged_xml" coverage/cobertura.xml
            python3 tests/transform_coverage.py coverage/cobertura.xml
          else
            echo "Merged cobertura.xml not found"
            exit 1
          fi

      - name: Enforce Coverage Threshold
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('coverage/cobertura.xml').getroot()
          line_rate = float(root.get('line-rate', '0')) * 100
          print(f'Total coverage: {line_rate:.2f}%')
          if line_rate < 90.0:
              raise SystemExit('Coverage below 90% threshold')
          PY

      - name: Generate Detailed Summary
        if: always()
        run: |
          python3 tests/generate_summary.py coverage/cobertura.xml | tee coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: full-coverage-report
          path: coverage/merged/

      - name: Add Coverage PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          recreate: true
          path: coverage-summary.md
