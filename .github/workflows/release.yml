---
name: "Release"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve tag and release notes
        id: notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if ! printf '%s\n' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag must match vN.N.N: ${tag}" >&2
            exit 1
          fi
          notes_file="docs/releases/${tag}.md"

          if [ ! -f "$notes_file" ]; then
            echo "::error::Missing release notes: ${notes_file}" >&2
            exit 1
          fi

          version_file_content="$(tr -d '[:space:]' < VERSION)"
          if [ "$version_file_content" != "$tag" ]; then
            echo "::error::VERSION file (${version_file_content}) does not match tag (${tag})" >&2
            exit 1
          fi

          title_line="$(head -n1 "$notes_file")"
          if ! printf '%s\n' "$title_line" | grep -qE '^#[[:space:]]+[^[:space:]]'; then
            echo "::error::Release notes must start with a non-empty H1 heading: ${notes_file}" >&2
            exit 1
          fi

          title="$(printf '%s\n' "$title_line" | sed -E 's/^#+[[:space:]]*//')"
          if [ -z "$title" ]; then
            echo "::error::Release notes H1 title is empty: ${notes_file}" >&2
            exit 1
          fi

          tail -n +2 "$notes_file" > release_body.md

          {
            echo "tag=${tag}"
            echo "notes_file=${notes_file}"
            echo "title=${title}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.notes.outputs.tag }}
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file release_body.md
