# SonarQube Cloud configuration (https://sonarcloud.io/project/overview?id=ventura8_Raspberry-Pi-OS-Bing-Wallpaper-Auto-update)
sonar.organization=ventura8
sonar.projectKey=ventura8_Raspberry-Pi-OS-Bing-Wallpaper-Auto-update
sonar.projectName=Raspberry-Pi-OS-Bing-Wallpaper-Auto-update

sonar.sources=bing_wallpaper.sh,install.sh,uninstall.sh,scripts,Dockerfile,.github/workflows
sonar.tests=tests
sonar.exclusions=coverage/**,coverage_inputs/**,assets/**
sonar.sourceEncoding=UTF-8

sonar.python.version=3.13

# Shell line coverage is produced by kcov (merged across CI suites) and converted to
# Sonar generic coverage format by scripts/cobertura_to_sonar.py.
sonar.coverageReportPaths=coverage/sonar-coverage.xml
# Python helper scripts are tooling around the test suite, not product code measured by kcov.
sonar.coverage.exclusions=scripts/**,Dockerfile,.github/**
